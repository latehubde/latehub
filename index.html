    <!-- Logo, Leiste und Überschriften-Schrift -->
    <style>
        /* Durchgängig schwarze Leiste */
        .navbar-default,
        .navbar-default .navbar-collapse {
            background-color: #000000;
        }
        .navbar-default .navbar-nav > li.active > a {
            background-color: #000000;
        }

        /* Überschriften-Schrift */
        h1 {
            font-family: "Montserrat", "Open Sans", sans-serif;
            font-weight: 800;
            font-size: 36px;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        /* Logo-Größe und Position (Handy / Tablet / Desktop) */
        .navbar-default .navbar-brand {
            height: auto;
            padding: 8px 15px;
        }
        .navbar-default .navbar-brand img {
            display: block;
            height: 34px;
            width: auto;
        }
        @media (min-width: 768px) {
            .navbar-default {
                background-color: #000000;
            }
            .navbar-default .navbar-brand {
                padding: 10px 40px;
            }
            .navbar-default .navbar-brand img {
                height: 46px;
            }
        }
        @media (min-width: 992px) {
            h1 {
                font-size: 46px;
            }
            .navbar-default .navbar-brand {
                padding: 22px 40px;
            }
            .navbar-default .navbar-brand img {
                height: 65px;
            }
        }
    </style>

</head>
